<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prolog Cycling</title>
    <!--
      GitHub Pages serves this for any unknown path (e.g. a hard refresh on
      /contacts, since there's no server to rewrite it to index.html). This
      redirects such requests back to index.html, preserving the intended
      path in the query string, which index.html's inline script decodes
      and restores via history.replaceState — so BrowserRouter still sees
      the real URL and app + crawlers see clean URLs, not /#/contacts.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
