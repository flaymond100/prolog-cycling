<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PROLOG Cycling Crew — Design System Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
  <nav class="ds-nav">
    <div class="ds-nav__logo">PROLOG</div>
    <div class="ds-nav__meta">Women's WorldTeam &middot; Est. 2026</div>
  </nav>
  <hr class="ds-rule">

  <section style="padding: var(--space-7); display:flex; flex-direction:column; gap: var(--space-6);">
    <div>
      <div style="font: var(--text-eyebrow); text-transform:uppercase; letter-spacing:0.22em; color: var(--color-ink-muted); margin-bottom: var(--space-4);">A New Chapter</div>
      <div style="font: var(--text-display-xl); color: var(--color-ink); max-width: 720px; font-style: italic;">Something new is coming to the road.</div>
    </div>

    <div style="display:flex; gap: var(--space-6); flex-wrap:wrap; align-items:center;">
      <input class="ds-input" placeholder="your@email.com">
      <button class="ds-button">Notify me &rarr;</button>
    </div>

    <div style="display:flex; gap: var(--space-2); align-items:center;">
      <span style="width:24px; height:24px; background: var(--color-primary-deep);"></span>
      <span style="width:24px; height:24px; background: var(--color-blue-bold);"></span>
      <span style="width:24px; height:24px; background: var(--color-primary);"></span>
      <span style="width:24px; height:24px; background: var(--color-border-strong); border:1px solid var(--color-border);"></span>
      <span style="width:24px; height:24px; background: var(--color-surface); border:1px solid var(--color-border);"></span>
    </div>

    <div class="ds-hero-bold" style="padding: var(--space-7); text-align:center;">
      <div class="ds-hero-bold__headline">Something</div>
      <div class="ds-hero-bold__headline ds-hero-bold__headline--outline">New</div>
      <div class="ds-hero-bold__headline">Is Coming</div>
    </div>

    <button type="button" class="ds-menu-toggle" aria-label="Toggle menu" onclick="this.classList.toggle('is-open')">
      <span></span><span></span><span></span>
    </button>
  </section>
</body>
</html>
