    <script>
      // Restores the real path GitHub Pages' 404.html redirect encoded into
      // the query string, before React Router (or anything else) reads the
      // URL. See public/404.html for the other half of this.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
